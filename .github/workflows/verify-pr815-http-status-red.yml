name: Verify PR 815 HTTP status red

on:
  push:
    branches:
      - verify-pr815-http-status-red

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run updater API tests
        run: ./gradlew :application:features:update:jvmTest --tests "io.writeopia.update.api.DesktopUpdateApiTest"
