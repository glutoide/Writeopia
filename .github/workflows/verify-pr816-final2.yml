name: Verify PR 816 final

on:
  push:
    branches:
      - verify-pr816-final-2

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run endpoint test
        run: ./gradlew :backend:gateway:test --tests "io.writeopia.api.geteway.DesktopAppVersionRoutingTest"
      - name: Compile gateway
        run: ./gradlew :backend:gateway:compileKotlin
