name: Verify WIP 815 final

on:
  push:
    branches:
      - wip-815-final-validation

concurrency:
  group: verify-wip-815-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile generated desktop version
        run: ./gradlew :application:core:configuration:compileKotlinJvm
      - name: Run updater tests
        run: ./gradlew :application:features:update:jvmTest
      - name: Run updater ktlint
        run: ./gradlew :application:features:update:ktlintCheck
      - name: Compile desktop app
        run: ./gradlew :application:composeApp:compileKotlinJvm
