name: Verify PR 815 current final

on:
  push:
    branches:
      - verify-pr815-current-final

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Updater tests
        run: ./gradlew :application:features:update:jvmTest
      - name: Updater ktlint
        run: ./gradlew :application:features:update:ktlintCheck
      - name: Desktop compile
        run: ./gradlew :application:composeApp:compileKotlinJvm
      - name: Verify desktop workflow permissions
        run: |
          grep -A 2 '^permissions:' .github/workflows/creates-desktop-apps.yml | grep 'contents: read'
          grep -A 6 '^  create_msi_app:' .github/workflows/creates-desktop-apps.yml | grep 'actions: read'
          grep -A 6 '^  create_msi_app:' .github/workflows/creates-desktop-apps.yml | grep 'contents: read'
