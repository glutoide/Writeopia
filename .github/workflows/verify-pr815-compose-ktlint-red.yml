name: Verify PR 815 compose ktlint red

on:
  push:
    branches:
      - verify-pr815-compose-ktlint-red

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compose app ktlint
        run: ./gradlew :application:composeApp:ktlintCheck
