name: Build and test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}

jobs:
  kt_lint:
    name: Ktlint
    if: >-
      github.actor == 'glutoide' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [personal-writeopia]
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Locate existing Android SDK (no installation)
        run: |
          if defined ANDROID_HOME if exist "%ANDROID_HOME%\platforms" exit /b 0
          if defined ANDROID_SDK_ROOT if exist "%ANDROID_SDK_ROOT%\platforms" (
            echo ANDROID_HOME=%ANDROID_SDK_ROOT%>>"%GITHUB_ENV%"
            exit /b 0
          )
          if exist "%LOCALAPPDATA%\Android\Sdk\platforms" (
            echo ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk>>"%GITHUB_ENV%"
            exit /b 0
          )
          for /d %%U in ("C:\Users\*") do if exist "%%~fU\AppData\Local\Android\Sdk\platforms" (
            echo ANDROID_HOME=%%~fU\AppData\Local\Android\Sdk>>"%GITHUB_ENV%"
            exit /b 0
          )
          echo Android SDK not available to this runner. No host changes made.
          exit /b 1
      - name: Ktlint
        run: gradlew.bat ktlintCheck
  mac_app_build:
    name: Mac App Build
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate signed mac app
        run: ./gradlew packageReleaseDmg
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
  ui_jvm_tests:
    name: Jvm UI Compose tests
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: JVM tests
        run: ./gradlew jvmTest
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  general_build:
    name: General - Build debug
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build debug
        run: ./gradlew assembleDebug test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-general
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  ios_build:
    name: iOS build
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug
        run: ./gradlew compileKotlinIosArm64
  backend_build_and_test:
    name: Backend - build
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build backend
        run: ./gradlew :backend:gateway:assemble
      - name: Test backend
        run: ./gradlew :backend:gateway:test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-backend
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7
  web_build:
    name: Web - Build debug
    if: ${{ false }} # no GitHub-hosted execution
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build web debug
        run: |
          ./gradlew kotlinUpgradeYarnLock
          ./gradlew jsBrowserDevelopmentWebpack
  test_docusaurus:
    name: Test docusaurus
    if: >-
      github.actor == 'glutoide' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [personal-writeopia]
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: documentation/writeopia_docs/package-lock.json
      - name: Install dependencies
        working-directory: ./documentation/writeopia_docs
        run: npm.cmd ci
      - name: Test build website
        working-directory: ./documentation/writeopia_docs
        run: npm.cmd run build


