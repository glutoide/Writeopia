name: Verify PR 815 current head

on:
  push:
    branches:
      - verify-pr815-current-e717

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify updater tests
        run: ./gradlew :application:features:update:jvmTest
      - name: Verify updater ktlint
        run: ./gradlew :application:features:update:ktlintCheck
      - name: Verify desktop compilation
        run: ./gradlew :application:composeApp:compileKotlinJvm
      - name: Verify constrained release permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/creates-desktop-apps.yml').read_text()
          assert 'permissions:\n  contents: read' in text
          assert 'actions: read' in text
          PY
