name: Verify version endpoint

on:
  push:
    branches:
      - verify-425-version-endpoint

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run gateway tests
        run: ./gradlew :backend:gateway:test
      - name: Compile gateway
        run: ./gradlew :backend:gateway:compileKotlin
