name: Generate Dokka

on:
  workflow_dispatch:

jobs:
  generate_dokka:
    name: Generate Dokka
    if: ${{ github.actor == 'glutoide' }}
    runs-on: [personal-writeopia]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate Dokka
        run: gradlew.bat dokkaHtmlMultiModule
      - name: Save Dokka on the existing Windows runner (no Actions artifact)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'build\dokka\htmlMultiModule'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw 'Dokka output directory is missing'
          }
          $localRoot = 'C:\Glutoide'
          if (-not (Test-Path -LiteralPath $localRoot -PathType Container)) {
            throw 'Expected existing laptop storage C:\Glutoide is unavailable'
          }
          $destination = Join-Path $localRoot ('artifacts\Writeopia\Dokka\' + $env:GITHUB_SHA)
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          $files = @(Get-ChildItem -LiteralPath $destination -File -Recurse)
          if ($files.Count -eq 0) { throw 'No Dokka files were copied' }
          Write-Host ('Dokka saved locally: {0} ({1} files)' -f $destination, $files.Count)

